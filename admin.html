<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .dashboard-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 600px; /* Adjusted max-width for simplicity */
            box-sizing: border-box;
            margin-bottom: 20px;
            text-align: center;
        }
        h1 {
            color: #1a202c;
            font-size: 4.5em; /* Increased font size for more emphasis */
            margin-bottom: 30px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1); /* Added subtle text shadow */
        }
        .dashboard-card {
            background-color: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .dashboard-card h2 {
            font-size: 1.8em;
            color: #2d3748;
            margin-bottom: 20px;
        }

        /* Styles for the buttons */
        .button-group {
            display: flex;
            flex-direction: column; /* Stack buttons vertically */
            gap: 20px; /* Space between buttons */
            margin-top: 20px;
        }
        .button-group a {
            display: inline-block; /* Allows padding and margins */
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1.2em;
            font-weight: bold;
            text-decoration: none; /* Remove underline for link */
            transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        /* Specific styles for each button type */
        .button-group .go-to-form-button {
            background-color: #007bff; /* Blue */
            color: white;
        }
        .button-group .go-to-form-button:hover {
            background-color: #0056b3;
            transform: translateY(-2px);
        }

        .button-group .export-csv-button {
            background-color: #28a745; /* Green */
            color: white;
        }
        .button-group .export-csv-button:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 20px;
            }
            h1 {
                font-size: 3em; /* Adjusted for smaller screens */
            }
            .dashboard-card h2 {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <h1>Admin Dashboard</h1>

        <div class="dashboard-card">
            <h2>Actions</h2>
            <div class="button-group">
                
                <a href="http://localhost/phpmyadmin/index.php?route=/database/structure&db=intern" class="go-to-form-button">Admin Dashboard</a>
</div>
        </div>

        </div>
</body>
</html>
