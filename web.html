                file:mr-4 file:py-2 file:px-4
                file:rounded-full file:border-0
                file:text-sm file:font-semibold
                file:bg-indigo-50 file:text-indigo-700
                hover:file:bg-indigo-100 cursor-pointer">
            <span id="resume-error" class="error-message"></span>
            <small>Accepted formats: PDF, DOC, DOCX (Max 5MB)</small>
        </div>


        <div class="form-buttons">
            <input type="submit" id="sub" value="Submit" class="rounded-lg">
            <input type="button" id="previewBtn" value="Preview" onclick="showPreview()" class="rounded-lg">
            <input type="reset" id="res" value="Reset" class="rounded-lg">
        </div>
        <div id="form-preview" class="hidden rounded-lg">
            <h2>Form Data Preview</h2>
            <div id="preview-content">
            </div>
            <div class="preview-buttons"> <button class="edit-button rounded-lg" onclick="editForm()">Edit Form</button> <button class="close-button rounded-lg" onclick="closePreview()">Close Preview</button>
            </div>
        </div>
    </form>
    <div id="custom-message-box" class="hidden rounded-lg"></div>

    <script>
        // Helper function to get element and error span
        function getFieldElements(id) {
            const input = document.getElementById(id);
            const errorSpan = document.getElementById(id + '-error');
            return {
                input,
                errorSpan
            };
        }

        // --- Individual Validation Functions (Real-time & on Submit) ---

        function validateName(input, errorSpan, fieldName) {
            const value = input.value.trim();
            const namePattern = /^[a-zA-Z\s.-]+$/; // Allows letters, spaces, hyphens, and periods
            if (value === '') {
                errorSpan.textContent = `Please enter your ${fieldName}.`;
                return false;
            } else if (!namePattern.test(value)) {
                errorSpan.textContent = `Only letters, spaces, hyphens, and periods are allowed in ${fieldName}.`;
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }

        function validateStudentId(input, errorSpan) {
            const value = input.value.trim();
            // Example: Allows alphanumeric, hyphens, and spaces. Adjust regex as needed for specific ID format.
            const idPattern = /^[a-zA-Z0-9\s-]+$/;
            if (value === '') {
                errorSpan.textContent = 'Please enter your Student ID.';
                return false;
            } else if (!idPattern.test(value)) {
                errorSpan.textContent = 'Student ID can only contain alphanumeric characters, spaces, and hyphens.';
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }

        function validateCollegeName(input, errorSpan) {
            const value = input.value.trim();
            if (value === '') {
                errorSpan.textContent = 'Please enter your college name.';
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }

        function validateQualification(input, errorSpan) {
            const value = input.value.trim();
            if (value === '') {
                errorSpan.textContent = 'Please enter your qualification.';
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }

        function validateSpecializationSelect(selectElement, errorSpan) {
            const value = selectElement.value;
            const otherSpecInputGroup = document.getElementById('other-specialization-group');
            const otherSpecTextInput = document.getElementById('other_specialization_text');
            const otherSpecTextErrorSpan = document.getElementById('other_specialization_text-error');

            if (value === '') {
                errorSpan.textContent = 'Please select your area of specialization.';
                otherSpecInputGroup.classList.add('hidden'); // Use Tailwind hidden class
                otherSpecTextInput.removeAttribute('required'); // Remove required if hidden
                otherSpecTextErrorSpan.textContent = ''; // Clear error
                return false;
            } else if (value === 'Other (Please specify)') { // CORRECTED: Changed 'other_specialization' to 'Other (Please specify)'
                otherSpecInputGroup.classList.remove('hidden'); // Show if 'Other' is selected
                otherSpecTextInput.setAttribute('required', 'required'); // Make required
                return validateOtherSpecializationInput(otherSpecTextInput, otherSpecTextErrorSpan); // Validate it immediately
            } else {
                otherSpecInputGroup.classList.add('hidden'); // Hide for other selections
                otherSpecTextInput.removeAttribute('required'); // Remove required
                otherSpecTextInput.value = ''; // Clear its value
                otherSpecTextErrorSpan.textContent = ''; // Clear error
            }
            errorSpan.textContent = '';
            return true;
        }


        function validateOtherSpecializationInput(input, errorSpan) {
            const value = input.value.trim();
            if (input.hasAttribute('required') && value === '') {
                errorSpan.textContent = 'Please specify your other specialization.';
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }


        function validateYearOfStudy(input, errorSpan) {
            const value = input.value.trim();
            const yearNum = parseInt(value);
            if (value === '' || isNaN(yearNum) || yearNum <= 0 || yearNum > 10) {
                errorSpan.textContent = 'Please enter a valid year of study (e.g., 1, 2, 3, max 10).';
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }

        function validateEmail(input, errorSpan) {
            const value = input.value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (value === '') {
                errorSpan.textContent = 'Please enter your email address.';
                return false;
            } else if (!emailPattern.test(value)) {
                errorSpan.textContent = 'Please enter a valid email address.';
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }

        function validatePhoneNumber(input, errorSpan, fieldName) {
            const value = input.value.trim();
            const phonePattern = /^\d{10}$/; // Exactly 10 digits
            if (value === '') {
                errorSpan.textContent = `Please enter a 10-digit ${fieldName}.`;
                return false;
            } else if (!phonePattern.test(value)) {
                errorSpan.textContent = `Please enter a valid 10-digit ${fieldName}.`;
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }

        function validateLocation(input, errorSpan) {
            const value = input.value.trim();
            if (value === '') {
                errorSpan.textContent = 'Please enter your address for communication.';
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }

        function validateFieldOfInterestText(input, errorSpan) {
            const value = input.value.trim();
            if (value === '') {
                errorSpan.textContent = 'Please enter your field of interest.';
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }

        function validateDates(durFromInput, durToInput, durFromError, durToError) {
            const durFrom = durFromInput.value;
            const durTo = durToInput.value;
            let datesValid = true;

            if (durFrom === '') {
                durFromError.textContent = 'Please select a start date.';
                datesValid = false;
            } else {
                durFromError.textContent = '';
            }

            if (durTo === '') {
                durToError.textContent = 'Please select an end date.';
                datesValid = false;
            } else {
                durToError.textContent = '';
            }

            if (durFrom && durTo) {
                const startDate = new Date(durFrom);
                const endDate = new Date(durTo);
                if (startDate >= endDate) {
                    durToError.textContent = 'End date must be after the start date.';
                    datesValid = false;
                }
            }
            return datesValid;
        }

        function validateResume(input, errorSpan) {
            if (input.files.length === 0) {
                errorSpan.textContent = "Please upload your resume.";
                return false;
            } else {
                const file = input.files[0];
                const allowedTypes = ['application/pdf', 'application/msword', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
                const maxSize = 5 * 1024 * 1024; // 5MB

                if (!allowedTypes.includes(file.type)) {
                    errorSpan.textContent = "Invalid file type. Please upload a PDF, DOC, or DOCX.";
                    return false;
                }
                if (file.size > maxSize) {
                    errorSpan.textContent = "File size exceeds 5MB limit.";
                    return false;
                }
            }
            errorSpan.textContent = '';
            return true;
        }

        function validatePhoto(input, errorSpan) {
            const photoPreview = document.getElementById('photo-preview');
            if (input.files.length === 0) {
                // Photo is optional, so no error if not provided
                errorSpan.textContent = "";
                photoPreview.classList.add('hidden'); // Use Tailwind hidden class
                photoPreview.src = '#';
                return true;
            } else {
                const file = input.files[0];
                const allowedTypes = ['image/jpeg', 'image/png', 'image/gif'];
                const maxSize = 2 * 1024 * 1024; // 2MB

                if (!allowedTypes.includes(file.type)) {
                    errorSpan.textContent = "Invalid file type. Please upload a JPG, PNG, or GIF image.";
                    photoPreview.classList.add('hidden');
                    photoPreview.src = '#';
                    return false;
                }
                if (file.size > maxSize) {
                    errorSpan.textContent = "File size exceeds 2MB limit.";
                    photoPreview.classList.add('hidden');
                    photoPreview.src = '#';
                    return false;
                }

                // If validation passes, display the image preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoPreview.src = e.target.result;
                    photoPreview.classList.remove('hidden'); // Show the preview
                };
                reader.readAsDataURL(file);
            }
            errorSpan.textContent = '';
            return true;
        }

        function validateAlternateContactType(errorSpan) {
            const altContactTypeRadios = document.querySelectorAll('input[name="alt_contact_type"]');
            let radioSelected = false;
            for (const radio of altContactTypeRadios) {
                if (radio.checked) {
                    radioSelected = true;
                    break;
                }
            }
            if (!radioSelected) {
                errorSpan.textContent = 'Please select an alternate contact type.';
                return false;
            }
            errorSpan.textContent = '';
            return true;
        }


        // --- Main Form Validation (on Submit) ---
        function validateForm() {
            resetErrors(); // Clear all errors before re-validating

            let isValid = true;

            // Get all field elements
            const fnameElements = getFieldElements('fname');
            const lnameElements = getFieldElements('lname');
            const idElements = getFieldElements('id');
            const clgElements = getFieldElements('clg');
            const qualElements = getFieldElements('qual');
            const specElements = getFieldElements('spec'); // This is the select element
            const otherSpecInputElements = getFieldElements('other_specialization_text'); // This is the input for 'Other' specialization
            const yrsElements = getFieldElements('yrs');
            const emailElements = getFieldElements('email');
            const numElements = getFieldElements('num');
            const altnumElements = getFieldElements('altnum');
            const altcondetElements = getFieldElements('altcondet');
            const locElements = getFieldElements('loc');
            const fieldElements = getFieldElements('field'); // This is the text input for Field of Interest
            const durFromElements = getFieldElements('durFrom');
            const durToElements = getFieldElements('durTo');
            const resumeElements = getFieldElements('resume');
            const photoElements = getFieldElements('photo');
            const altContactTypeErrorElement = document.getElementById('alt-contact-type-error'); // Directly get the span for radio errors


            // Validate all fields (order matters for conditional fields)
            isValid = validateName(fnameElements.input, fnameElements.errorSpan, 'First Name') && isValid;
            isValid = validateName(lnameElements.input, lnameElements.errorSpan, 'Last Name') && isValid;
            isValid = validateStudentId(idElements.input, idElements.errorSpan) && isValid;
            isValid = validateCollegeName(clgElements.input, clgElements.errorSpan) && isValid;
            isValid = validateQualification(qualElements.input, qualElements.errorSpan) && isValid;
            // Specialization validation needs to be handled carefully due to the 'other' field
            isValid = validateSpecializationSelect(specElements.input, specElements.errorSpan) && isValid;
            // This will also handle the validation of other_specialization_text if 'other' is selected

            isValid = validateYearOfStudy(yrsElements.input, yrsElements.errorSpan) && isValid;
            isValid = validateEmail(emailElements.input, emailElements.errorSpan) && isValid;
            isValid = validatePhoneNumber(numElements.input, numElements.errorSpan, 'Mobile Number') && isValid;
            isValid = validatePhoneNumber(altnumElements.input, altnumElements.errorSpan, 'Alternate Contact Number') && isValid;
            isValid = validateName(altcondetElements.input, altcondetElements.errorSpan, 'Alternate Contact Name') && isValid;
            isValid = validateLocation(locElements.input, locElements.errorSpan) && isValid;
            isValid = validateFieldOfInterestText(fieldElements.input, fieldElements.errorSpan) && isValid;
            isValid = validateDates(durFromElements.input, durToElements.input, durFromElements.errorSpan, durToElements.errorSpan) && isValid;
            isValid = validateResume(resumeElements.input, resumeElements.errorSpan) && isValid;
            isValid = validatePhoto(photoElements.input, photoElements.errorSpan) && isValid; // Validate photo
            isValid = validateAlternateContactType(altContactTypeErrorElement) && isValid;


            if (isValid) {
                showCustomMessage("Form is valid and will be submitted!");
                return true;
            } else {
                showCustomMessage("Please correct the errors in the form.", 'error'); // Show error message
                return false;
            }
        }

        // --- Event Listeners for Real-time Validation ---
        document.addEventListener('DOMContentLoaded', () => {
            // Get all relevant input elements
            const fnameInput = document.getElementById('fname');
            const lnameInput = document.getElementById('lname');
            const idInput = document.getElementById('id');
            const clgInput = document.getElementById('clg');
            const qualInput = document.getElementById('qual');
            const specSelect = document.getElementById('spec'); // Select element
            const otherSpecTextInput = document.getElementById('other_specialization_text'); // Text input for 'Other' specialization
            const yrsInput = document.getElementById('yrs');
            const emailInput = document.getElementById('email');
            const numInput = document.getElementById('num');
            const altnumInput = document.getElementById('altnum');
            const altcondetInput = document.getElementById('altcondet');
            const locInput = document.getElementById('loc');
            const fieldInput = document.getElementById('field'); // Text input for Field of Interest
            const durFromInput = document.getElementById('durFrom');
            const durToInput = document.getElementById('durTo');
            const resumeInput = document.getElementById('resume');
            const photoInput = document.getElementById('photo');
            const resetButton = document.getElementById('res');
            const altContactTypeRadios = document.querySelectorAll('input[name="alt_contact_type"]');
            const altContactTypeErrorSpan = document.getElementById('alt-contact-type-error');


            // Attach input event listeners for real-time validation
            fnameInput.addEventListener('input', () => validateName(fnameInput, document.getElementById('fname-error'), 'First Name'));
            lnameInput.addEventListener('input', () => validateName(lnameInput, document.getElementById('lname-error'), 'Last Name'));
            idInput.addEventListener('input', () => validateStudentId(idInput, document.getElementById('id-error')));
            clgInput.addEventListener('input', () => validateCollegeName(clgInput, document.getElementById('clg-error')));
            qualInput.addEventListener('input', () => validateQualification(qualInput, document.getElementById('qual-error')));
            yrsInput.addEventListener('input', () => validateYearOfStudy(yrsInput, document.getElementById('yrs-error')));
            emailInput.addEventListener('input', () => validateEmail(emailInput, document.getElementById('email-error')));
            numInput.addEventListener('input', () => validatePhoneNumber(numInput, document.getElementById('num-error'), 'Mobile Number'));
            altnumInput.addEventListener('input', () => validatePhoneNumber(altnumInput, document.getElementById('altnum-error'), 'Alternate Contact Number'));
            altcondetInput.addEventListener('input', () => validateName(altcondetInput, document.getElementById('altcondet-error'), 'Alternate Contact Name'));
            locInput.addEventListener('input', () => validateLocation(locInput, document.getElementById('loc-error')));
            fieldInput.addEventListener('input', () => validateFieldOfInterestText(fieldInput, document.getElementById('field-error')));


            // For select and date inputs, 'change' event is more appropriate
            specSelect.addEventListener('change', () => {
                validateSpecializationSelect(specSelect, document.getElementById('spec-error'));
                // When specialization changes, also re-validate the 'other specialization' input
                validateOtherSpecializationInput(otherSpecTextInput, document.getElementById('other_specialization_text-error'));
            });
            otherSpecTextInput.addEventListener('input', () => validateOtherSpecializationInput(otherSpecTextInput, document.getElementById('other_specialization_text-error'))); // Real-time for 'Other Specialization' input

            durFromInput.addEventListener('change', () => validateDates(durFromInput, durToInput, document.getElementById('durFrom-error'), document.getElementById('durTo-error')));
            durToInput.addEventListener('change', () => validateDates(durFromInput, durToInput, document.getElementById('durFrom-error'), document.getElementById('durTo-error')));

            resumeInput.addEventListener('change', () => validateResume(resumeInput, document.getElementById('resume-error')));
            photoInput.addEventListener('change', () => validatePhoto(photoInput, document.getElementById('photo-error')));
            // Attach event listener for radio buttons
            altContactTypeRadios.forEach(radio => {
                radio.addEventListener('change', () => validateAlternateContactType(altContactTypeErrorSpan));
            });


            // Reset button functionality
            resetButton.addEventListener('click', resetForm);

            // Initial call to hide 'other specialization' if not selected
            validateSpecializationSelect(specSelect, document.getElementById('spec-error'));
        });


        // --- Utility Functions ---

        function resetErrors() {
            const errorMessages = document.querySelectorAll(".error-message");
            errorMessages.forEach(span => {
                span.textContent = "";
            });
        }

        function resetForm() {
            document.getElementById('fname').value = '';
            document.getElementById('lname').value = '';
            document.getElementById('id').value = '';
            document.getElementById('clg').value = '';
            document.getElementById('qual').value = '';
            document.getElementById('spec').value = ''; // Reset select
            document.getElementById('other_specialization_text').value = ''; // Reset other specialization field
            document.getElementById('other-specialization-group').classList.add('hidden'); // Hide it again
            document.getElementById('yrs').value = '';
            document.getElementById('email').value = '';
            document.getElementById('num').value = '';
            document.getElementById('altnum').value = '';
            document.getElementById('altcondet').value = '';
            document.getElementById('loc').value = '';
            document.getElementById('field').value = '';
            document.getElementById('durFrom').value = '';
            document.getElementById('durTo').value = '';
            document.getElementById('resume').value = ''; // Clear file input
            document.getElementById('photo').value = '';

            // Clear and hide photo preview
            const photoPreview = document.getElementById('photo-preview');
            photoPreview.src = '#';
            photoPreview.classList.add('hidden');
            // Reset radio buttons
            const radioButtons = document.querySelectorAll('input[name="alt_contact_type"]');
            radioButtons.forEach(radio => radio.checked = false);

            resetErrors(); // Clear error messages
        }


        // Custom message box function (replaces alert())
        function showCustomMessage(message, type = 'success') {
            const messageBox = document.getElementById('custom-message-box');
            if (!messageBox) {
                console.error('Custom message box element not found!');
                return;
            }

            messageBox.textContent = message;
            messageBox.className = 'show'; // Show the box

            if (type === 'success') {
                messageBox.style.backgroundColor = '#4CAF50';
                /* Green */
            } else if (type === 'error') {
                messageBox.style.backgroundColor = '#ef4444';
                /* Red */
            }
            setTimeout(() => {
                messageBox.className = 'hidden'; // Hide the box
            }, 3000);
        }

        function showPreview() {
            const form = document.querySelector('form');
            const formData = new FormData(form);
            let previewTableHtml = '<table>';

            // Iterate over all form data entries
            for (const [key, value] of formData.entries()) {
                if (key === 'photo' && value instanceof File) {
                    if (value.size > 0) {
                        // Create a URL for the photo file to display it in the preview
                        const photoUrl = URL.createObjectURL(value);
                        previewTableHtml += `<tr><td><b>${formatLabel(key)}:</b></td><td><img src="${photoUrl}" alt="Photo Preview" style="max-width:150px; max-height:150px; border-radius: 8px; object-fit: cover;"></td></tr>`;
                    } else {
                        previewTableHtml += `<tr><td><b>${formatLabel(key)}:</b></td><td>No photo uploaded</td></tr>`;
                    }
                } else if (key === 'resume' && value instanceof File) {
                    if (value.size > 0) {
                        // Display resume file name and size
                        previewTableHtml += `<tr><td><b>${formatLabel(key)}:</b></td><td>${value.name} (${(value.size / 1024).toFixed(2)} KB)</td></tr>`;
                    } else {
                        previewTableHtml += `<tr><td><b>${formatLabel(key)}:</b></td><td>No resume uploaded</td></tr>`;
                    }
                } else if (key === 'alt_contact_type') {
                    const selectedRadio = form.querySelector(`input[name="alt_contact_type"][value="${value}"]`);
                    if (selectedRadio) {
                        previewTableHtml += `<tr><td><b>Alternate Contact Type:</b></td><td>${selectedRadio.nextElementSibling.textContent.trim()}</td></tr>`;
                    }
                } else if (key === 'specialization') {
                    const selectedOption = form.querySelector(`#spec option[value="${value}"]`);
                    if (selectedOption) {
                        previewTableHtml += `<tr><td><b>Specialization:</b></td><td>${selectedOption.textContent.trim()}</td></tr>`;
                    }
                } else if (key === 'other_specialization_text' && formData.get('specialization') !== 'Other (Please specify)') { // Corrected this condition too for consistency
                    continue; // Skip if 'Other Specialization' is not selected
                } else {
                    previewTableHtml += `<tr><td><b>${formatLabel(key)}:</b></td><td>${value}</td></tr>`;
                }
            }
            previewTableHtml += '</table>';

            const newTabContent = `
                <!DOCTYPE html>
                <html lang="en">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Form Preview</title>
                    <style>
                        body {
                            font-family: 'Inter', sans-serif;
                            background-color: #f0f2f5;
                            color: #333;
                            padding: 20px;
                            display: flex;
                            flex-direction: column;
                            align-items: center;
                            min-height: 100vh;
                            margin: 0;
                        }
                        .preview-container {
                            background-color: #ffffff;
                            padding: 20px;
                            border-radius: 12px;
                            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
                            width: 100%;
                            max-width: 700px;
                            box-sizing: border-box;
                            margin-top: 20px;
                            text-align: left;
                        }
                        h2 {
                            text-align: center;
                            color: #1a202c;
                            font-size: 2em;
                            margin-bottom: 25px;
                            font-weight: bold;
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                            margin-bottom: 30px;
                        }
                        td {
                            padding: 12px;
                            border-bottom: 1px solid #eee;
                            vertical-align: top;
                            font-size: 1.1em;
                        }
                        td:first-child {
                            font-weight: bold;
                            width: 35%;
                            color: #2d3748;
                        }
                        .button-group {
                            text-align: center;
                            margin-top: 20px;
                            display: flex; /* Make buttons flex */
                            justify-content: center; /* Center buttons */
                            gap: 20px; /* Space between buttons */
                            flex-wrap: wrap; /* Allow wrapping on small screens */
                        }
                        .button-group button {
                            padding: 12px 30px;
                            border: none;
                            border-radius: 8px;
                            cursor: pointer;
                            font-size: 1.1em;
                            font-weight: bold;
                            transition: background-color 0.3s ease-in-out, transform 0.2s ease-in-out;
                            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
                        }
                        .button-group button.close-tab-button { /* Specific style for close button */
                            background-color: #6366f1; /* Indigo */
                            color: white;
                        }
                        .button-group button.close-tab-button:hover {
                            background-color: #4f46e5;
                            transform: translateY(-2px);
                        }
                        .button-group button.edit-form-button { /* Specific style for edit button */
                            background-color: #f97316; /* Orange */
                            color: white;
                        }
                        .button-group button.edit-form-button:hover {
                            background-color: #ea580c;
                            transform: translateY(-2px);
                        }
                        @media (max-width: 768px) {
                            .preview-container {
                                padding: 20px;
                                margin: 10px;
                            }
                            td:first-child {
                                width: 40%;
                            }
                            .button-group {
                                flex-direction: column; /* Stack buttons vertically on small screens */
                                gap: 15px;
                            }
                            .button-group button {
                                width: 100%; /* Full width for stacked buttons */
                            }
                        }
                    </style>
                </head>
                <body>
                    <div class="preview-container">
                        <h2>Form Data Preview</h2>
                        ${previewTableHtml}
                        <div class="button-group">
                            <button class="edit-form-button" onclick="window.close()">Edit Form</button>
                        </div>
                    </div>
                </body>
                </html>
            `;

            const newTab = window.open('', '_blank');
            if (newTab) {
                newTab.document.write(newTabContent);
                newTab.document.close();
            } else {
                showCustomMessage("Pop-up blocked! Please allow pop-ups for this site to view the preview.", 'error');
            }
        }

        /**
         * Helper function to format form field names into more readable labels.
         * @param {string} key - The name attribute of the form field.
         * @returns {string} - A human-readable label.
         */
        function formatLabel(key) {
            return key
                .replace(/_/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase());
        }
    </script>
</body>

</html>
